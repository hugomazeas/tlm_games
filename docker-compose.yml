services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_ID: ${LOCAL_UID:-1000}
        GROUP_ID: ${LOCAL_GID:-1000}
    container_name: games-hub
    restart: unless-stopped
    networks:
      - proxy
    ports:
      - "8081:80"
    volumes:
      - .:/var/www
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/database/database.sqlite
    # supervisord reads its config from the mounted repo, not the copy baked into
    # the image: deploy.sh never rebuilds, so a baked-in program (camera-queue)
    # would never reach prod.
    command: >
      sh -c "chmod 666 /dev/video0 /dev/snd/* 2>/dev/null || true &&
             composer install --no-interaction &&
             cp -n .env.example .env || true &&
             php artisan key:generate --force &&
             touch /var/www/database/database.sqlite &&
             mkdir -p /var/www/storage/app/recordings/live /var/www/storage/app/public/recordings/matches &&
             chown -R www-data:www-data /var/www/vendor /var/www/database /var/www/storage /var/www/bootstrap/cache &&
             chmod -R 775 /var/www/storage /var/www/bootstrap/cache &&
             php artisan storage:link --force 2>/dev/null || true &&
             php artisan migrate --force &&
             php artisan db:seed --force &&
             /usr/bin/supervisord -c /var/www/docker/supervisor/supervisord.conf"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_ID: ${LOCAL_UID:-1000}
        GROUP_ID: ${LOCAL_GID:-1000}
    container_name: games-hub-worker
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - .:/var/www
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/database/database.sqlite
    depends_on:
      - app
    command: php artisan queue:work --sleep=3 --tries=1 --timeout=600
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"

  # The hot potato game server (game-server/). A stock Bun image running the
  # mounted repo, so `make up` ships changes with no rebuild; Bun loads the
  # repo's .env from its working directory, so HOT_POTATO_INTERNAL_SECRET is
  # shared with Laravel. The app's nginx proxies /games/hot-potato/live/ here.
  hot-potato:
    image: oven/bun:1.4.0-alpine
    container_name: games-hub-hot-potato
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - .:/var/www
    working_dir: /var/www
    environment:
      - HOT_POTATO_HOST=0.0.0.0
      - HOT_POTATO_PORT=8090
      - HOT_POTATO_LARAVEL_URL=http://games-hub
    command: bun game-server/src/server.ts
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"

networks:
  # Shared with the other apps behind Caddy; owned by the `proxy` compose
  # project on the server. `make up` creates it locally when missing.
  proxy:
    name: proxy
    external: true

