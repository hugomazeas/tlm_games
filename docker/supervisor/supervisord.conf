[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true

; Copies the site config from the mounted repo first: deploy.sh never
; rebuilds, so the copy baked into the image would never see a new route.
[program:nginx]
command=sh -c "cp /var/www/docker/nginx/default.conf /etc/nginx/http.d/default.conf && exec nginx -g 'daemon off;'"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true

[program:reverb]
command=php /var/www/artisan reverb:start --host=0.0.0.0 --port=8080
user=www-data
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true

; Stops recordings after their post-match tail. Lives here, not in the worker
; container, because only this container can see the ffmpeg process to signal it.
[program:camera-queue]
command=php /var/www/artisan queue:work --queue=camera --sleep=1 --tries=1 --timeout=60
user=www-data
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
